# Configuração LibreChat — Guimarães Aranha (v0.8.8)
version: 1.3.17
cache: true

interface:
  customWelcome: 'Bem-vindo ao assistente de IA da Guimarães Aranha'
  # Retenção (LGPD): conversas temporárias expiram em 30 dias; ajustar depois.
  retentionMode: 'temporary'
  temporaryChatRetention: 720

registration:
  socialLogins: []

balance:
  enabled: false

# Provedor único: OpenRouter (endpoint OpenAI-compatível). Chave em OPENROUTER_KEY (Coolify).
# Lista de modelos: edite `models.default` e deixe `fetch: false` para mostrar só os aprovados.
endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        # 1º da lista = padrão. Piloto: Haiku (dia a dia) e GPT-6.1 Terra (análise).
        default: ['anthropic/claude-haiku-5.5', 'openai/gpt-6.1-terra']
        fetch: false
      titleConvo: true
      titleModel: 'current_model'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
