# Guimarães Aranha: build da imagem do LibreChat e publicação no GHCR.
# O Coolify só puxa a imagem pronta (sem build na VPS). Workflows do upstream foram removidos neste repo.
name: GA - Build imagem

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/README.md'

concurrency:
  group: ga-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=5120
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=main
          tags: |
            ghcr.io/bascowave/librechat-guimaraes:latest
            ghcr.io/bascowave/librechat-guimaraes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
